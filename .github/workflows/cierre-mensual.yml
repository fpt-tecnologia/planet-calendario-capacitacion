name: Cierre mensual
on:
  schedule:
    # Día 1 de cada mes a las 00:15 de Ciudad de México (06:15 UTC; México no usa horario de verano desde 2022)
    - cron: '15 6 1 * *'
  workflow_dispatch:
jobs:
  cierre:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Aplicar cierre
        env: { FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: node scripts/cierre-mensual.mjs
